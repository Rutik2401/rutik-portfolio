<nav
  [ngClass]="{
    'scrolled': isScrolled(),
    'hidden-nav': isHidden()
  }"
  class="navbar fixed top-0 left-0 right-0 z-50"
>
  <div class="navbar-inner container-custom mx-auto">

    <!-- Logo -->
    <a (click)="scrollTo('#hero')" class="logo">
      <span class="logo-bracket">[</span>
      <span class="logo-name">RUTIK<span class="logo-dot">.</span>DEV</span>
      <span class="logo-bracket">]</span>
    </a>

    <!-- Desktop Nav Links -->
    <ul class="hidden md:flex items-center gap-1">
      @for (link of navLinks; track link.href; let i = $index) {
        <li>
          <a
            (click)="scrollTo(link.href)"
            [ngClass]="{ 'active-link': activeSection() === link.href.slice(1) }"
            class="nav-link"
          >
            <span class="nav-num">{{ '0' + (i + 1) }}</span>
            <span class="nav-label">{{ link.label }}</span>
          </a>
        </li>
      }
    </ul>

    <!-- CTA + Hamburger -->
    <div class="flex items-center gap-3">
      <a
        href="https://github.com/Rutik2401"
        target="_blank"
        rel="noopener noreferrer"
        class="hidden md:inline-flex github-btn"
      >
        <span class="btn-prompt">&gt;</span>
        GITHUB
      </a>

      <!-- Mobile hamburger -->
      <button
        (click)="toggleMobileMenu()"
        class="md:hidden hamburger"
        aria-label="Toggle menu"
      >
        <span [ngClass]="{ 'rotate-45 translate-y-2': mobileOpen() }"></span>
        <span [ngClass]="{ 'opacity-0': mobileOpen() }"></span>
        <span [ngClass]="{ '-rotate-45 -translate-y-2': mobileOpen() }"></span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  @if (mobileOpen()) {
    <div class="mobile-menu md:hidden">
      <ul>
        @for (link of navLinks; track link.href; let i = $index) {
          <li>
            <a (click)="scrollTo(link.href); closeMobileMenu()" class="mobile-link">
              <span class="nav-num">{{ '0' + (i + 1) }}</span>
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  }
</nav>
